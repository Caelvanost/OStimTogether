; OStim Together v0.33.0
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; PROCEDURAL PENIS ANIMATIONS BRIDGE (0.33.0):
; The optional FOMOD component installs OStimTogether_PPA.ini, which enables a
; native bridge to AccuratePenetration.dll. The bridge consumes PPA's official
; SKSE API V1 AnimationUpdateEvent stream and tracks the TRUE local player's
; performer position, receiving actor position, SceneContext and PenetrationSite
; (Mouth/Anus/Vagina/Both/HandL/HandR/Hands). State changes are deduplicated and
; sent over their own reliable ordered multiplayer channel.
;
; PPA API V1 currently exposes observation/listener registration only. It does
; not expose a supported setter for the active per-stage target selected by the
; PPA in-game menu. Received target state is therefore cached behind one remote
; apply function, ready for a future official write API or a separately verified
; internal bridge. OStim Together deliberately does not synthesize PPA hotkeys,
; rewrite live animation-tag files, or patch unknown DLL offsets.
;
; ADDON CHANNEL / NPC MIRROR CONSISTENCY (0.32.1):
; Addon channel identifiers are canonicalized case-insensitively before local
; refresh, transport and remote caching. In particular, "OCum" and "ocum" now
; share one "ocum" cache, preventing an older differently-cased CumOverlays
; snapshot from overwriting a newer remote 3D overlay state during reapply.
;
; NPC equipment locking now uses the same native Actor.UnequipItem relocation
; and flags as OStim 7.5b GameActor::unequip(), followed by Actor.QueueNiNodeUpdate
; whenever clothing was actually removed. Equipment-lock game-thread work is
; also coalesced so a slow frame cannot accumulate many identical 25 ms tasks.
; OCum-defined armor remains exempt from the NPC clothing lock.
;
; UNIFIED REMOTE SCENE ANCHOR (0.32.0):
; Remote OStim mirrors use one positioning architecture for every scene.
; If the sender used real furniture, the receiver resolves and passes that real
; reference to OStim as before. If no physical furniture can be resolved --
; including ordinary free-standing and wall scenes -- OStim Together creates an
; invisible, non-interactive vanilla XMarkerHeading (base 00000034) exactly at
; the sender's authoritative scene center and passes that reference through the
; same ThreadBuilder::setFurniture() path.
;
; XMarkerHeading has no furniture markers and normally matches no OStim
; FurnitureType, so OStim resolves it to type "none": marker offset 0, furniture
; offset 0, rotation offset 0 and scale multiplier 1. The animations therefore
; remain ordinary free/wall animations, while Thread::center is sourced from a
; stable world reference just like the physical-furniture path that already
; aligns Kahel and Elir correctly.
;
; The temporary virtual anchor is retained for the complete mirror lifetime and
; disabled shortly after the authoritative STOP. Duplicate START packets reuse
; the existing marker. If creation fails, the legacy noFurniture path remains as
; a fallback rather than aborting the scene.
;
; Because the remote mirror now has a real anchor reference, historical
; free-scene position repair systems naturally stand down on that mirror:
; FreeSceneSelfOriginLock and FreeScenePhaseSync both classify it the same way as
; a physical-furniture thread. OStim owns actor positioning from its normal
; alignActor()->lockAtPosition() path; OStim Together performs no continuous
; PlayerCharacter position correction.
;
; 0.31.9 REPLAY SAFETY FALLBACK:
; The free-scene initial-replay and phase-SetSpeed suppressions remain in place
; only as fallback protection if a virtual anchor cannot be created. They are
; not the primary synchronization method in 0.33.x.
;
; RACEMENU / SKEE STABILITY (0.31.7):
; Unchanged ADDONOBJ packets no longer request overlay rebuilds. Only genuine
; equip-object state transitions may request one. Rebuild requests are coalesced
; per actor into a single delayed RaceMenu AddOverlays call using the normal
; queued path (immediate=false).
;
; OCUM PAPYRUS REGISTRATION REPAIR (0.31.6):
; The Core locates OSTogetherOCumIntegrationQuest and explicitly invokes
; OStimTogetherOCum.RegisterIntegration() after load so existing saves re-arm
; the live OCum polling integration.
;
; OCUM LIVE SCENE POLL (0.31.5):
; The optional OStimTogetherOCum integration polls the TRUE local player every
; 500 ms while OStim thread 0 is active and synchronizes CumOverlays plus OStim
; equip-object state.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.

