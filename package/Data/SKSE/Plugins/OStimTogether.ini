; OStim Together v0.30.0
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING VISUAL SYNC (0.30.0):
; The 0.29.0 READY/COMMIT phase barrier completed correctly on both clients but
; did not repair the remaining visual offset of dynamic STR player proxies, so
; it has been removed from the runtime and from CMake.
;
; For ordinary no-furniture/non-wall player scenes, Skyrim Together remains the
; sole owner of remote TESObjectREFR world position. OStim Together never
; SetPosition/Update3DPosition-warps those proxies. The existing delayed
; StopTranslation release remains in place after OStim's native alignment.
;
; The only extra visual state synchronized in 0.30.0 is
; "NPC Root [Root]" LOCAL TRANSLATION. The dedicated realtime STRPM channel
; ostimtogether.root sends x/y/z only. Remote rotation, scale, world transforms,
; child transforms and actor/reference positions are NEVER copied. Incoming
; translation is range-checked and is applied only when the sender's resolved
; STR proxy is actually an actor in the active local OStim player thread.
;
; The unsafe 0.28.0 behavior is not restored: there is no remote root rotation
; write and no recursive scene-graph transform update.
;
; PROXY-ONLY THREAD CLEANUP (0.30.0):
; OStim pre-scene UI can create an auxiliary thread containing a mapped STR
; proxy but no real local PlayerCharacter. Such a thread can survive and make
; later mirror builders reject the remote player as already busy. These
; proxy-only threads are now stopped automatically on START. Threads containing
; the real local player are never targeted by this cleanup.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; On Accept, the remote client still sends live OCum overlay and equip-object
; state before INVITE_RESPONSE.

