; OStim Together v0.20.1
;
; Default install:
; - enables networking automatically,
; - uses the local Skyrim character name as its network name,
; - discovers other OStim Together clients automatically on the LAN,
; - reuses Skyrim Together Reborn's saved direct-connect host for distant
;   clients when available,
; - uses UDP port 27991 by default.

[General]
ToggleKey=68
ClearKey=87
IntervalMs=25
DebugNotifications=1

[Equipment]
SlotMask=140

[Network]
; 0 = enable OStim Together networking
; 1 = disable OStim Together networking entirely
Disabled=0

; LAN discovery. Keep enabled for local players. Internet routers do not
; forward LAN broadcasts, so remote clients use AutoRemoteFromSTR/RemotePeers.
AutoDiscovery=1

; 1 = accept Internet clients and relay their gameplay packets to every other
; active peer. Install the FOMOD relay-host option only on the Player1 / STR
; host machine, and forward UDP port 27991 to that PC.
RelayMode=0

; Normally leave this alone on every PC.
LocalPort=27991

; Zero-config remote clients for Skyrim Together Reborn direct-connect
; sessions. When enabled, OStim Together reads STR's saved direct-connect
; address and sends to the same host on AutoRemotePort.
AutoRemoteFromSTR=1
AutoRemotePort=27991

; Optional: if SharedSecret is empty, use STR's saved direct-connect password
; on clients and STServer.ini's sPassword on the relay host when available.
; Keep this off for the most forgiving zero-INI setup.
AutoSharedSecretFromSTR=0

DiscoveryIntervalMs=1000
PeerTimeoutMs=10000

; Manual fallback for public IPs or DNS names. Separate entries with commas or
; semicolons. A port may follow each host.
; Example: RemotePeers=myhost.example:27991,203.0.113.8:27992
RemotePeers=

; Optional explicit authentication secret. If set, every client must use the
; exact same value. Discovery and gameplay packets then require HMAC-SHA256.
SharedSecret=

; Legacy single-peer setting, retained for older configurations. PeerHost is
; added to RemotePeers and now supports DNS names as well as IPv4 addresses.
PeerHost=
PeerPort=27991
