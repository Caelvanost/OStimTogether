; OStim Together v0.20.0
;
; NO NETWORK CONFIGURATION IS REQUIRED.
;
; OStim Together now:
; - enables networking automatically,
; - uses the local Skyrim character name as its network name,
; - discovers other OStim Together clients automatically on the LAN,
; - uses UDP port 27991 by default.
;
; The values below are optional advanced overrides only.

[General]
ToggleKey=68
ClearKey=87
IntervalMs=25
DebugNotifications=1

[Equipment]
SlotMask=140

[Network]
; 0 = automatic LAN discovery (recommended)
; 1 = disable OStim Together networking entirely
Disabled=0

; Automatic discovery is enabled by default.
AutoDiscovery=1

; Normally leave this alone on every PC.
LocalPort=27991

; Advanced troubleshooting only:
; DiscoveryIntervalMs=1000
; PeerTimeoutMs=10000
;
; Manual fallback:
; AutoDiscovery=0
; PeerHost=192.168.1.42
; PeerPort=27991
