; OStim Together v0.30.3
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING PHASE BARRIER (0.30.3):
; Ordinary no-furniture/non-wall player scenes retain the NTP-like timing
; exchange over ostimtogether.phase. PHASE_PREP/READY calibrate RTT and the
; remote-minus-owner steady-clock offset, then PHASE_COMMIT gives every client
; one future execution deadline in its own local clock space.
;
; At that deadline OStim Together no longer calls SetActorAlignment: the normal
; OStim node change has already established the role/reference placement and
; Skyrim Together owns remote proxy reference movement. Re-aligning every actor
; again at COMMIT caused an unnecessary proxy translation fight.
;
; When the local OStim thread is already on the requested speed, 0.30.3 builds
; the exact OStim 7.5b animation event for each role (speed animation name +
; GraphActor animationIndex, including singleSpeed actors), sets OStimSpeed and
; calls Actor::NotifyAnimationGraph directly on the game thread. This removes
; OStim SetSpeed's additional asynchronous game-task hop from the phase-critical
; path. If the exact read-only event probe cannot be validated, or local speed
; differs, SetSpeed is used only as a safe fallback.
;
; The phase replay performs no direct actor/reference world-position writes and
; no skeleton transform writes. Logs expose PHASE DIRECT REPLAY per actor plus
; direct/fallback mode and actual deadline lateness.
;
; Skyrim Together remains the sole owner of remote TESObjectREFR world position.
; OStim Together never SetPosition/Update3DPosition-warps ordinary free-scene
; proxies. A delayed StopTranslation still clears any older native OStim
; TranslateTo remaining on dynamic STR proxies.
;
; The NPC Root [Root] translation channel remains translation-only. Current
; probes show this node at (0,0,0) for the tested animations, so it is not relied
; upon as the primary alignment mechanism. Rotation, scale, world transforms,
; descendants and actor/reference positions are never copied through it.
;
; PROXY-ONLY THREAD CLEANUP:
; Auxiliary OStim threads containing a mapped STR proxy but no real local
; PlayerCharacter are stopped automatically. Threads containing the real local
; player are never targeted by this cleanup.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; On Accept, the remote client still sends live OCum overlay and equip-object
; state before INVITE_RESPONSE.

