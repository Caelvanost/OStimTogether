; OStim Together v0.27.0
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets, discover LAN peers, relay
; Internet traffic, or require any OStim Together network/port configuration.
;
; Direct player-targeted OStim starts are consent-gated before OStim receives
; the scene-start input, so Furniture/Add Actor UI is not opened until the
; remote player accepts. Remote consent uses native MessageBoxData factory
; defaults for Skyrim Souls / Unpaused Menus compatibility.
;
; Add Actor consent is mandatory core functionality. Core includes a patched
; OSKSE.pex plus OStimTogetherNative.pex so selecting a remote player from
; OStim's UIExtensions Add Actor list pauses that exact callback until consent,
; before role selection/fade/thread creation. OStim Together's OSKSE.pex must
; win its file conflict with OStim.
;
; Multiplayer player threads expose OStim's native SceneMenu on every involved
; client. Any accepted participant can change node/search result, speed or stop
; immediately. The initiator is only a transport relay/sequencer; there is no
; owner approval or veto for participant scene controls.
;
; In ordinary no-furniture, non-wall scenes on OStim 7.5b, the full proxy pose
; guard is replaced after the short initial settle by a reference-only guard.
; TESObjectREFR location/heading stay on OStim's logical actor pose while the
; loaded 3D root is never warped, allowing animation root motion to remain free.
; Furniture and wall alignment keep the established full pose guard.
;
; On Accept, the remote client sends its live OCum overlays and vaginal/anal
; mesh state before INVITE_RESPONSE so the initiating client has appearance
; state before the synchronized scene starts.
;
; Install and configure STRPluginMessagingAPI on every Skyrim Together client
; and the required STRPM server resource on the Skyrim Together server.

[General]
ToggleKey=68
ClearKey=87
IntervalMs=25
DebugNotifications=1

