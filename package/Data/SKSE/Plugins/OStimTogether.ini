; OStim Together v0.30.1
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING PHASE BARRIER (0.30.1):
; FreeScenePhaseSync existed in the 0.30.0 source/build but was accidentally not
; registered in main.cpp and its ostimtogether.phase STRPM channel was never
; started. 0.30.1 wires it into kPostPostLoad/kDataLoaded and resets it on
; kPreLoadGame.
;
; For ordinary no-furniture/non-wall player scenes the owner emits PHASE_PREP.
; Mirrors answer PHASE_READY only after their real local OStim thread exists on
; the same node. The owner then emits PHASE_COMMIT and all clients perform the
; same native OStim SetActorAlignment + SetSpeed replay after a common delay.
; No direct actor/reference world-position or skeleton transform writes are
; performed by the phase barrier.
;
; Skyrim Together remains the sole owner of remote TESObjectREFR world position.
; OStim Together never SetPosition/Update3DPosition-warps ordinary free-scene
; proxies. The delayed StopTranslation release remains after native alignment.
;
; The 0.30.x NPC Root [Root] translation channel remains translation-only.
; Current runtime probes show this node at (0,0,0) for the tested free-scene
; animations, so it is not relied upon as the primary alignment mechanism.
; Rotation, scale, world transforms, descendants and actor/reference positions
; are never copied through that channel.
;
; PROXY-ONLY THREAD CLEANUP:
; Auxiliary OStim threads containing a mapped STR proxy but no real local
; PlayerCharacter are stopped automatically. Threads containing the real local
; player are never targeted by this cleanup.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; On Accept, the remote client still sends live OCum overlay and equip-object
; state before INVITE_RESPONSE.

