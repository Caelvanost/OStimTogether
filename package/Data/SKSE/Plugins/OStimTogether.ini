; OStim Together v0.31.6
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING MIRROR SELF CORRECTION (0.31.6):
; 0.31.5 diagnostics proved the visible Elir offset was already present on
; Player2's TRUE local PlayerCharacter before STR transport. Player1's Elir
; proxy reproduced essentially the same rootFromCenter displacement, so STR was
; not adding a second offset. The drift is produced during mirror OStim startup.
;
; On a REMOTE MIRROR only, the true local player now receives at most two
; bounded center corrections per free-standing node: the first about 700 ms
; after the node is observed, the second about 1100 ms later as a high-latency
; phase-replay backup. A write occurs only if reference/root drift exceeds one
; Skyrim unit. Owner-local players are never corrected by this path. This is
; intentionally NOT the old continuous self-position lock that caused visible
; oscillation. No direct skeleton transform is written.
;
; FREE-STANDING REMOTE PROXY ORIGIN (0.31.4):
; Each STR remote-player proxy's logical TESObjectREFR location remains held on
; the common authoritative center. Proxy rendered 3D/root and all skeleton
; transforms remain untouched by that continuous logical-origin path.
;
; FREE-STANDING ROLE DIAGNOSTICS (0.31.5):
; FREE ROLE DIAG and PROXY ORIGIN LOCK log real-player/proxy reference and root
; positions plus rootFromCenter and rootScale every 500 ms.
;
; FREE-STANDING PARTICIPANT ALIGNMENT:
; Each real PlayerCharacter remains authoritative only for their own OStim
; ActorAlignmentData (X/Y/Z offsets, scale, rotation and SOS bend). Once per
; free-standing node this state is broadcast over ostimtogether.align and
; applied to the corresponding proxy through OStim SetActorAlignment().
;
; FREE-STANDING PHASE BARRIER:
; PHASE_PREP/READY/COMMIT retains the synchronized OStim SetSpeed replay. A
; delayed native TESObjectREFR StopTranslation clears transient OStim
; TranslateTo on dynamic proxies. Remote skeleton translation/rotation/scale
; writes remain disabled.
;
; OCUM PAPYRUS REGISTRATION REPAIR (0.31.6):
; Updating an attached quest PEX in an existing save does not rerun OnInit().
; The Core therefore locates OSTogetherOCumIntegrationQuest and explicitly
; invokes OStimTogetherOCum.RegisterIntegration() at DataLoaded and again after
; PostLoadGame, once Papyrus save state has been restored. This re-arms the
; 0.31.5 ostim_start/ostim_end live poll without requiring a new save or a
; manual stopquest/startquest cycle.
;
; OCUM LIVE SCENE POLL (0.31.5):
; The optional OStimTogetherOCum integration polls the TRUE local player every
; 500 ms while OStim thread 0 is active. Each poll asks Core to capture and
; locally refresh CumOverlays RaceMenu geometry, then reads
; OActor.IsObjectEquipped for ocumvagmesh/ocumanmesh, with OCum F37/F3B armor
; state retained only as a fallback.
;
; OCUM NATIVE FALLBACK (0.31.4):
; Core still observes conventional F37/F3B worn-armor transitions when exposed
; by the runtime. OStim equip-object state remains authoritative when the two
; representations differ.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.
;
; REMOTE MIRROR CLEANUP (0.31.1):
; ProxyOnlyThreadCleanup preserves registered OStim Together mirrors and stops
; only unregistered orphan proxy-only OStim threads.

