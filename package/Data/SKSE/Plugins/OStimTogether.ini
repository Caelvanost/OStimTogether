; OStim Together v0.31.3
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING LOCAL PLAYER ORIGIN (0.31.3):
; The shared-origin lock is multiplayer-only and arms after OStim finishes its
; START/ChangeNode startup work. Locally-owned scenes derive their center after
; that startup. A remote mirror does NOT derive another center from its local
; participant role: it uses the authoritative center already received in the
; owner's START packet. Every real participant therefore publishes the same
; logical free-scene origin through STR.
;
; Ordinary Player + NPC scenes bypass this system completely. The lock modifies
; only the real local PlayerCharacter TESObjectREFR logical location. It never
; writes a remote STR proxy, SetPosition, TranslateTo, Update3DPosition or any
; skeleton transform. Rendered animation/root motion remains OStim-owned.
;
; FREE-STANDING PARTICIPANT ALIGNMENT:
; Each real PlayerCharacter remains authoritative only for their own OStim
; ActorAlignmentData (X/Y/Z offsets, scale, rotation and SOS bend). Once per
; free-standing node this state is broadcast over ostimtogether.align and
; applied to the corresponding proxy through OStim SetActorAlignment().
;
; FREE-STANDING PHASE BARRIER:
; PHASE_PREP/READY/COMMIT retains the synchronized OStim SetSpeed replay. A
; delayed native TESObjectREFR StopTranslation clears transient OStim
; TranslateTo on dynamic proxies. RE::Actor has no CommonLib StopTranslation
; member; the implementation uses the validated TESObjectREFR native relocation.
;
; REMOTE MIRROR CLEANUP (0.31.1):
; ProxyOnlyThreadCleanup preserves every thread registered by OStim Together as
; a legitimate remote mirror, including Player1 + NPC scenes observed on a
; client whose real PlayerCharacter is not in that scene. Only unregistered
; orphan proxy-only OStim threads are stopped.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. OCum uses
; such records both as short-lived RaceMenu overlay bootstrap helpers and as
; persistent vaginal/anal OStim equip-object meshes. The 25 ms anti-reequip
; loop therefore no longer races OCum's own scene-time setup or removes its
; creampie meshes until STOP. Ordinary NPC clothing remains governed by the
; configured SlotMask.
;
; Remote skeleton translation/rotation/scale writes remain disabled.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; OCum live mesh synchronization uses both OStim's own equip-object state and
; the underlying OCum armor equipped state. Either source being active is
; sufficient to publish ocumvagmesh / ocumanmesh as equipped.

