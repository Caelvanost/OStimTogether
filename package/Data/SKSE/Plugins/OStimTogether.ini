; OStim Together v0.29.0
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING PHASE SYNC (0.29.0):
; Runtime logs showed that an owner OStim scene can already be animating while
; the remote mirror thread takes roughly one second to finish creation. In
; root-motion animations this means STR can replicate a real player's motion
; from one animation phase while the local proxy is rendering another phase.
;
; Ordinary no-furniture/non-wall player scenes therefore use a dedicated
; reliable/ordered STRPM phase barrier on channel ostimtogether.phase. The
; owner sends PHASE_PREP for START and later NODE changes. Each remote reports
; PHASE_READY only after its real local OStim mirror exists on the matching
; node. The owner then sends PHASE_COMMIT and all clients, after the same short
; delay, call OStim's own Get/SetActorAlignment and replay the current speed.
; This re-aligns and restarts the paired animation through OStim itself rather
; than writing transforms directly.
;
; Skyrim Together remains the owner of remote TESObjectREFR movement. The phase
; barrier performs no SetPosition, Update3DPosition or skeleton transform
; writes. Short OStim TranslateTo alignment on dynamic STR proxies is released
; afterwards with StopTranslation. Furniture/wall scenes remain unchanged.
;
; The unsafe 0.28.0 NPC Root [Root] synchronization remains permanently
; disabled. No remote skeleton transforms are registered or written.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; On Accept, the remote client still sends live OCum overlay and equip-object
; state before INVITE_RESPONSE.

