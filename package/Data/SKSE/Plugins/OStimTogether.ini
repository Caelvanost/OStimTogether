; OStim Together v0.31.8
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING 7.5b START OWNERSHIP (0.31.8):
; When the TRUE local PlayerCharacter participates in a remote OStim 7.5b
; mirror without furniture/wall anchoring, PREANCHOR SELF moves that player to
; the sender's authoritative center BEFORE builder->start(). OStim therefore
; constructs Thread::center from the same world point as the owner. The legacy
; post-start SetSpeed(currentSpeed) animation replay is suppressed for this
; exact path so playAnimation() is not restarted after native alignment. OStim
; owns the local player's position/animation after startup; OStim Together does
; not perform a later PlayerCharacter position correction.
;
; Observer-only mirrors, furniture scenes, wall scenes and older validated
; OStim layouts keep the legacy initial animation replay.
;
; FREE-STANDING MIRROR SELF OWNERSHIP (0.31.7):
; The bounded PlayerCharacter corrections introduced in 0.31.6 remain disabled.
; Runtime testing showed that even two delayed writes per node make OStim
; Together and Skyrim Together fight over the true mirror participant's world
; position. The true local PlayerCharacter is read-only after native startup.
;
; FREE-STANDING REMOTE PROXY ORIGIN (0.31.4):
; Each STR remote-player proxy's logical TESObjectREFR location remains held on
; the common authoritative center. Proxy rendered 3D/root and all skeleton
; transforms remain untouched by that continuous logical-origin path.
;
; FREE-STANDING ROLE DIAGNOSTICS (0.31.5):
; FREE ROLE DIAG and PROXY ORIGIN LOCK log real-player/proxy reference and root
; positions plus rootFromCenter and rootScale every 500 ms.
;
; FREE-STANDING PARTICIPANT ALIGNMENT:
; Each real PlayerCharacter remains authoritative only for their own OStim
; ActorAlignmentData (X/Y/Z offsets, scale, rotation and SOS bend). Once per
; free-standing node this state is broadcast over ostimtogether.align and
; applied to the corresponding proxy through OStim SetActorAlignment().
;
; FREE-STANDING PHASE BARRIER:
; PHASE_PREP/READY/COMMIT retains synchronized node/speed phase handling after
; startup. A delayed native TESObjectREFR StopTranslation clears transient OStim
; TranslateTo on dynamic proxies. Remote skeleton translation/rotation/scale
; writes remain disabled.
;
; RACEMENU / SKEE STABILITY (0.31.7):
; Unchanged ADDONOBJ packets no longer request overlay rebuilds. Only genuine
; equip-object state transitions may request one. Rebuild requests are coalesced
; per actor into a single delayed RaceMenu AddOverlays call using the normal
; queued path (immediate=false).
;
; OCUM PAPYRUS REGISTRATION REPAIR (0.31.6):
; The Core locates OSTogetherOCumIntegrationQuest and explicitly invokes
; OStimTogetherOCum.RegisterIntegration() after load so existing saves re-arm
; the live OCum polling integration.
;
; OCUM LIVE SCENE POLL (0.31.5):
; The optional OStimTogetherOCum integration polls the TRUE local player every
; 500 ms while OStim thread 0 is active and synchronizes CumOverlays plus OStim
; equip-object state.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.

