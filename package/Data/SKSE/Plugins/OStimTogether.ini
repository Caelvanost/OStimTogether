; OStim Together v0.31.0
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING PARTICIPANT ALIGNMENT (0.31.0):
; A real PlayerCharacter and the dynamic STR proxy representing that same human
; can resolve different OStim alignment-cache keys. Each real player is now
; authoritative only for their own ActorAlignmentData (X/Y/Z offsets, scale,
; rotation and SOS bend). Once per free-standing node this state is broadcast
; over the reliable/ordered ostimtogether.align channel. A receiving client
; applies it once to the sender's proxy through OStim's public
; SetActorAlignment() API.
;
; There are no direct skeleton writes, SetPosition calls, Update3DPosition
; warps or continuous position corrections in this alignment channel.
; Furniture and wall scenes are excluded.
;
; FREE-STANDING PHASE BARRIER:
; Ordinary no-furniture/non-wall player scenes retain the NTP-like timing
; exchange over ostimtogether.phase. PHASE_PREP/READY calibrate RTT and the
; remote-minus-owner steady-clock offset, then PHASE_COMMIT gives every client
; one future execution deadline in its own local clock space.
;
; The phase replay still uses OStim's native GetActorAlignment /
; SetActorAlignment -> SetSpeed ordering. In 0.31.0 the proxy alignment cache
; has first been replaced with the corresponding real participant's published
; values, so the synchronized replay no longer depends on a synthetic STR
; proxy's independently-derived alignment key.
;
; Skyrim Together remains the sole owner of remote TESObjectREFR world position.
; A delayed StopTranslation clears any older native OStim TranslateTo on dynamic
; STR proxies after the synchronized replay.
;
; Remote skeleton translation/rotation/scale writes remain disabled.
;
; PROXY-ONLY THREAD CLEANUP:
; Auxiliary OStim threads containing a mapped STR proxy but no real local
; PlayerCharacter are stopped automatically. Threads containing the real local
; player are never targeted by this cleanup.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.
;
; OCum live mesh synchronization uses both OStim's own equip-object state and
; the underlying OCum armor equipped state. Either source being active is
; sufficient to publish ocumvagmesh / ocumanmesh as equipped.

