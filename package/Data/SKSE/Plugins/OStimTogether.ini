; OStim Together v0.31.4
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING REMOTE PROXY ORIGIN (0.31.4):
; The v0.31.3 runtime logs proved that writing the REAL local PlayerCharacter's
; TESObjectREFR origin does not move its rendered root: OStim/animation restores
; the reference to the role/root-motion position between ticks. Publishing that
; displaced local-player sample through STR then makes the remote proxy inherit
; the displacement before its own OStim animation applies the role displacement
; again.
;
; 0.31.4 therefore never writes the real local player. In a shared free-standing
; scene, only each STR remote-player proxy's logical TESObjectREFR location is
; held on the common authoritative scene center. The proxy's rendered 3D/root
; remains untouched and OStim-owned. No SetPosition, TranslateTo,
; Update3DPosition or skeleton transform is used by this lock. Observer-only
; Player + NPC mirrors remain outside this path because they already align
; correctly through native OStim behavior.
;
; FREE-STANDING PARTICIPANT ALIGNMENT:
; Each real PlayerCharacter remains authoritative only for their own OStim
; ActorAlignmentData (X/Y/Z offsets, scale, rotation and SOS bend). Once per
; free-standing node this state is broadcast over ostimtogether.align and
; applied to the corresponding proxy through OStim SetActorAlignment().
;
; FREE-STANDING PHASE BARRIER:
; PHASE_PREP/READY/COMMIT retains the synchronized direct animation-event replay.
; A delayed native TESObjectREFR StopTranslation clears transient OStim
; TranslateTo on dynamic proxies. Remote skeleton translation/rotation/scale
; writes remain disabled.
;
; OCUM LIVE MESH TRACKING (0.31.4):
; The native runtime now watches actual OCum.esp F37/F3B armor worn state on
; actors participating in active OStim threads. A real local player's 0->1/1->0
; mesh transitions are published directly over STRPM, replacing stale pre-scene
; false ADDONOBJ cache entries as soon as OCum really equips a mesh. Local
; non-proxy mesh wearers also receive a rate-limited Actor.QueueNiNodeUpdate
; every 500 ms while the mesh remains worn. This mirrors OStim's own safe 3D
; refresh path and survives scene-time body/node rebuilds without inventing a
; mesh that OCum did not actually equip.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.
;
; REMOTE MIRROR CLEANUP (0.31.1):
; ProxyOnlyThreadCleanup preserves every thread registered by OStim Together as
; a legitimate remote mirror. Only unregistered orphan proxy-only OStim threads
; are stopped.
;
; Shared SPEED remains idempotent so repeated identical speed state does not
; create animation replay/network feedback loops.

