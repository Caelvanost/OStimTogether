; OStim Together v0.31.5
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; FREE-STANDING REMOTE PROXY ORIGIN (0.31.4):
; In shared free-standing scenes only each STR remote-player proxy's logical
; TESObjectREFR location is held on the common authoritative center. The true
; local PlayerCharacter is never position-written by this lock. Proxy rendered
; 3D/root and all skeleton transforms remain untouched.
;
; FREE-STANDING ROLE DIAGNOSTICS (0.31.5):
; The 0.31.4 test converged to the same visual arrangement on both clients but
; Elir remained visibly misaligned. The OStim Missionary scene JSON contains no
; actor position offsets, so graphOffset=(0,0,0,0) is valid and is not the bug.
; Every 500 ms the existing free-scene diagnostic now logs the true local
; player's reference/root and the remote proxy reference/root, including each
; rendered root's offset from the authoritative center and root world scale.
; These reads perform no additional position, root, skeleton or scale writes.
;
; FREE-STANDING PARTICIPANT ALIGNMENT:
; Each real PlayerCharacter remains authoritative only for their own OStim
; ActorAlignmentData (X/Y/Z offsets, scale, rotation and SOS bend). Once per
; free-standing node this state is broadcast over ostimtogether.align and
; applied to the corresponding proxy through OStim SetActorAlignment().
;
; FREE-STANDING PHASE BARRIER:
; PHASE_PREP/READY/COMMIT retains the synchronized OStim SetSpeed replay. A
; delayed native TESObjectREFR StopTranslation clears transient OStim
; TranslateTo on dynamic proxies. Remote skeleton translation/rotation/scale
; writes remain disabled.
;
; OCUM LIVE SCENE POLL (0.31.5):
; The optional OStimTogetherOCum Papyrus integration no longer relies only on
; OCum's ocum_applied_cum callback. OStim's thread-0 ostim_start/ostim_end events
; arm a 500 ms poll for the TRUE local player during the scene. Every poll asks
; Core to capture and locally refresh CumOverlays RaceMenu geometry, then reads
; OStim's own OActor.IsObjectEquipped state for ocumvagmesh/ocumanmesh with the
; OCum F37/F3B armor state retained only as fallback. This handles the observed
; case where a mesh is visible in OStim while ordinary inventory IsWorn() is 0.
;
; OCUM NATIVE FALLBACK (0.31.4):
; Core still observes conventional F37/F3B worn-armor transitions when they are
; exposed by the runtime. The Papyrus OStim equip-object query is authoritative
; for scene-time mesh state when the two representations differ.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.
;
; REMOTE MIRROR CLEANUP (0.31.1):
; ProxyOnlyThreadCleanup preserves registered OStim Together mirrors and stops
; only unregistered orphan proxy-only OStim threads.

