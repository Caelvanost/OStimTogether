; OStim Together v0.33.2
;
; Multiplayer transport is provided exclusively by STRPluginMessagingAPI.
; OStim Together does not open its own sockets or use a UDP fallback.
;
; Direct player-targeted OStim starts and Add Actor selection remain consent
; gated before the synchronized scene is allowed to continue.
;
; Accepted participants have equal multi-master access to OStim's native scene
; controls. The initiator is only the transport relay/sequencer; there is no
; owner approval or veto for participant NODE/SPEED/STOP commands.
;
; PROCEDURAL PENIS ANIMATIONS / ACCURATE PENETRATION (0.33.2):
; The optional FOMOD component enables bidirectional synchronization of PPA's
; runtime per-stage penetration target controls. OStim Together intercepts the
; exact AnimationTagger::setTarget() and setInteraction() operations used by
; PPA's own menu, transports them only to other players in the active OStim
; thread, then invokes PPA's preserved original runtime setter on the receiver.
; This synchronizes target site and explicit target actor in multi-actor scenes.
;
; Supported AccuratePenetration.dll:
; SHA-256 0BD68B935E54211EEA71BE064AEB628B2AA268A7F35229FF554ED65A88EED087
; PE timestamp 0x6A633AE8, image size 0x239000. Timestamp, image size and exact
; machine-code signatures are verified before any hook is installed.
;
; v0.33.2 removes the final rel32/ASLR dependency completely. The verified PPA
; setInteraction and setTarget entries contain 16 and 18 bytes respectively of
; whole non-RIP-relative prologue instructions. OStim Together replaces those
; windows with a register-preserving 14-byte RIP-indirect absolute x64 jump and
; NOP padding. Preserved-original stubs replay the displaced instructions and
; return through another absolute x64 jump. No branch in this PPA bridge has a
; +/-2 GiB distance requirement.
;
; OCUM 3D OVERLAY MATERIALIZATION (0.33.2):
; Runtime logs proved that OCum overlay textures/alpha/node overrides were being
; captured and transported correctly while the visible RaceMenu geometry stayed
; stale. OStim Together now watches the actual CumOverlays override snapshot for
; every actor in an active OStim thread at a bounded 500 ms cadence. A RaceMenu
; refresh is requested only when that snapshot first becomes non-empty or later
; changes.
;
; Refreshes use RaceMenu/SKEE's public ActorUpdateManager: AddOverlayUpdate +
; AddNodeOverrideUpdate + Flush. This is RaceMenu's own save-load/3D-rebuild
; pipeline and, unlike IOverlayInterface::AddOverlays(), also supports the real
; PlayerCharacter. Requests remain coalesced per actor behind a 250 ms quiet
; window, preventing the 0.31.6 rebuild storm that previously crashed SKEE.
;
; The aggressive addon-channel case canonicalization introduced in 0.32.1 stays
; reverted for now; OCum's original rendering-path channel identity is preserved
; while the live geometry lifecycle is being validated.
;
; NPC equipment locking still uses the same native Actor.UnequipItem relocation
; and flags as OStim 7.5b GameActor::unequip(), followed by Actor.QueueNiNodeUpdate
; whenever clothing was actually removed. Equipment-lock game-thread work is
; coalesced so a slow frame cannot accumulate many identical 25 ms tasks.
; OCum-defined armor remains exempt from the NPC clothing lock.
;
; UNIFIED REMOTE SCENE ANCHOR (0.32.0):
; Remote OStim mirrors use one positioning architecture for every scene.
; If the sender used real furniture, the receiver resolves and passes that real
; reference to OStim as before. If no physical furniture can be resolved --
; including ordinary free-standing and wall scenes -- OStim Together creates an
; invisible, non-interactive vanilla XMarkerHeading (base 00000034) exactly at
; the sender's authoritative scene center and passes that reference through the
; same ThreadBuilder::setFurniture() path.
;
; XMarkerHeading has no furniture markers and normally matches no OStim
; FurnitureType, so OStim resolves it to type "none": marker offset 0, furniture
; offset 0, rotation offset 0 and scale multiplier 1. The animations therefore
; remain ordinary free/wall animations, while Thread::center is sourced from a
; stable world reference just like the physical-furniture path.
;
; The temporary virtual anchor is retained for the complete mirror lifetime and
; disabled shortly after the authoritative STOP. Duplicate START packets reuse
; the existing marker. If creation fails, the legacy noFurniture path remains as
; a fallback rather than aborting the scene.
;
; Because the remote mirror now has a real anchor reference, historical
; free-scene position repair systems naturally stand down on that mirror.
; OStim owns actor positioning from its normal alignActor()->lockAtPosition()
; path; OStim Together performs no continuous PlayerCharacter position correction.
;
; VIRTUAL-ANCHOR STARTUP REPLAY SAFETY (0.33.x):
; XMarkerHeading is a furniture object at the API level but semantically still a
; free-scene anchor. OStim Together therefore suppresses the old post-start
; SetSpeed(currentSpeed) animation replay for base 00000034, just as it does for
; noFurniture free scenes. Physical furniture keeps the legacy furniture path.
;
; OCUM PAPYRUS REGISTRATION REPAIR (0.31.6):
; The Core locates OSTogetherOCumIntegrationQuest and explicitly invokes
; OStimTogetherOCum.RegisterIntegration() after load so existing saves re-arm
; the live OCum polling integration.
;
; OCUM EQUIPMENT SAFETY (0.31.3):
; NPC EquipmentLock never strips armor records defined by OCum.esp. Ordinary
; NPC clothing remains governed by the configured SlotMask.

