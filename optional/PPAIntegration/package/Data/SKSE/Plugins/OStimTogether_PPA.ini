; OStim Together - Procedural Penis Animations integration
; Installed only when the PPA synchronization option is selected in the FOMOD.
;
; The current Accurate Penetration public API V1 exposes target-state observation
; but no supported target-state setter. OStim Together therefore enables capture,
; deduplication and multiplayer transport now, while remote application remains
; gated behind the future PPA write API / verified bridge.

[PPA]
Enabled=1
