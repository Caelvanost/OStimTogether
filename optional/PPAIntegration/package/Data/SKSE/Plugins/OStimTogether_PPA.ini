; OStim Together - Procedural Penis Animations integration
; Installed only when the PPA synchronization option is selected in the FOMOD.
;
; OStim Together 0.33.1 synchronizes PPA's runtime per-stage target operations
; by intercepting the same internal AnimationTagger functions used by PPA's own
; target menu and replaying them for the corresponding remote scene participant.
;
; Supported AccuratePenetration.dll for this integration:
; SHA-256 0BD68B935E54211EEA71BE064AEB628B2AA268A7F35229FF554ED65A88EED087
; PE timestamp 0x6A633AE8, image size 0x239000.
;
; The integration checks exact machine-code signatures before installing hooks.
; Its PPA entry detours use a near rel32 relay plus an unrestricted absolute x64
; jump to OStim Together, and verify the rel32 range before calling CommonLib.
; A different PPA build or unreachable relay layout disables this integration
; safely instead of using stale RVAs or terminating Skyrim.

[PPA]
Enabled=1
